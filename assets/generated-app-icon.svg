    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 780) rotate(90) scale(260)">
      <stop stop-color="#2F0A8F" stop-opacity="0.65"/>
