      <stop offset="1" stop-color="#4C14C7"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(780 250) rotate(90) scale(220)">
      <stop stop-color="#7FFFD4" stop-opacity="0.55"/>
